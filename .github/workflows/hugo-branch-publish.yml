name: Build Hugo and publish to master

on:
  push:
    branches: ["build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ secrets.PAGES_DEPLOY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Add .nojekyll
        run: New-Item -ItemType File -Path public/.nojekyll -Force
        shell: pwsh

      - name: Publish generated site to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: iCORELab/iCORELab.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com