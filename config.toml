baseURL = "https://icorelab.github.io/"
locale = "en-us"
title = "iCORE Laboratory | Louisiana State University"
enableRobotsTXT = true
enableGitInfo = true

[params]
  labName = "iCORE Laboratory"
  acronym = "Innovation in Controls and Robotics Engineering"
  institution = "Louisiana State University"
  tagline = "Control. Intelligence. Robotics."
  description = "Academic research and development in controls, robotics, autonomy, and intelligent systems."

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static"
    target = "assets"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.parser.attribute]
      block = true

    [markup.goldmark.renderHooks.image]
      useEmbedded = "auto"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

